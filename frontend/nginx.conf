# nginx for the SecSim SPA: serve dist/, fall back to index.html so
# Vue Router history routes (/login, /simulator, ...) load directly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache aggressively (Vite fingerprints filenames).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
